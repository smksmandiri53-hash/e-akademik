<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin - E-Akademik</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    #logout {
      background: white;
      color: #0f766e;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .welcome h2 {
      color: #164e63;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card .icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card h3 {
      color: #334155;
      margin-bottom: 5px;
    }

    .card p {
      color: #64748b;
      font-size: 14px;
    }

    .menu {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    .menu h2 {
      margin-bottom: 15px;
      color: #164e63;
    }

    .menu button {
      padding: 12px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎓 E-AKADEMIK</h1>

    <button id="logout">
      Logout
    </button>
  </header>

  <div class="container">

    <div class="welcome">

      <h2>Dashboard Admin</h2>

      <p>
        Selamat datang di Sistem E-Akademik
        SMKS Mandiri Bandar Agung.
      </p>

      <p id="emailAdmin"></p>

    </div>


    <div class="cards">

      <div class="card">
        <div class="icon">👨‍🎓</div>
        <h3>Data Siswa</h3>
        <p>Kelola data siswa</p>
      </div>

      <div class="card">
        <div class="icon">👨‍🏫</div>
        <h3>Data Guru</h3>
        <p>Kelola data guru</p>
      </div>

      <div class="card">
        <div class="icon">🏫</div>
        <h3>Kelas</h3>
        <p>Kelola data kelas</p>
      </div>

      <div class="card">
        <div class="icon">📚</div>
        <h3>Mata Pelajaran</h3>
        <p>Kelola mata pelajaran</p>
      </div>

    </div>


    <div class="menu">

      <h2>Menu Akademik</h2>

      <button>📅 Jadwal</button>

      <button>📝 Nilai</button>

      <button>📋 Absensi</button>

      <button>📢 Pengumuman</button>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBQb-W5Jaf2orW39-OYDOuh39xd8HhUkKQ",

      authDomain:
        "e-akademik-smks-mandiri-128fd.firebaseapp.com",

      projectId:
        "e-akademik-smks-mandiri-128fd",

      storageBucket:
        "e-akademik-smks-mandiri-128fd.firebasestorage.app",

      messagingSenderId:
        "551692981969",

      appId:
        "1:551692981969:web:97513dca9fe111f96a57f0"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    onAuthStateChanged(auth, (user) => {

      if (user) {

        document
          .getElementById("emailAdmin")
          .textContent =
          "Login sebagai: " + user.email;

      } else {

        window.location.href =
          "index.html";

      }

    });


    document
      .getElementById("logout")
      .addEventListener("click", async () => {

        await signOut(auth);

        window.location.href =
          "index.html";

      });

  </script>

</body>
</html>
